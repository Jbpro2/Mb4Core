<!DOCTYPE html>
<html lang="pt-BR" translate="no" data-bs-theme="light">

<head>
  <base href="/" target="_blank">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <link rel="shortcut icon" href="/static/img/favicon.svg" />
  <title>DTunnelMod - Gerenciar Usuários</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="../static/css/styles.css">
  <link rel="stylesheet" href="../static/css/bootstrap.css">
  <link rel="stylesheet" href="../static/css/sidebar.css">
  <link rel="stylesheet" href="../static/css/header.css">
  <link href="//cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css" rel="stylesheet" />
  <script src="//code.jquery.com/jquery-2.1.0.min.js"></script>
  <meta name="csrf-token" content="<%= it.csrfToken %>">
</head>

<body>
  <script src="//cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>
  <main class="d-flex">
    <%~ include("./sidebar", it) %>
    <div class="container-fluid p-0">
      <%~ include("./header", it) %>
      
      <div class="content pt-3 px-4 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-white">Gerenciar Usuários</h1>
            <button class="btn btn-success" onclick="generateApk()">
                <i class="bi bi-android2"></i> Gerar APK Agora
            </button>
        </div>

        <div class="card bg-dark text-white shadow border-secondary">
            <div class="card-header bg-dark border-secondary d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0 text-white">Usuários Cadastrados</h5>
                <small class="text-muted">Total: <span id="user-count">0</span></small>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Usuário</th>
                                <th>E-mail</th>
                                <th>Papel</th>
                                <th>Expiração</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            <tr>
                                <td colspan="5" class="text-center">Carregando usuários...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal para adicionar dias -->
  <div class="modal fade" id="addDaysModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content bg-dark text-white border-secondary">
              <div class="modal-header border-secondary">
                  <h5 class="modal-title">Adicionar Dias de Acesso</h5>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                  <input type="hidden" id="modal-user-id">
                  <div class="mb-3">
                      <label for="days-to-add" class="form-label">Quantidade de Dias</label>
                      <input type="number" class="form-control bg-secondary text-white border-0" id="days-to-add" value="30" min="1">
                  </div>
              </div>
              <div class="modal-footer border-secondary">
                  <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                  <button type="button" class="btn btn-primary" onclick="confirmAddDays()">Confirmar</button>
              </div>
          </div>
      </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../static/js/sidebar.js"></script>
  <script src="../static/js/utils.js"></script>

  <script>
    async function loadUsers() {
        try {
            const response = await fetch('/api/admin/users');
            const users = await response.json();
            const tbody = document.getElementById('user-table-body');
            document.getElementById('user-count').textContent = users.length;
            tbody.innerHTML = '';

            if (!Array.isArray(users) || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum usuário encontrado.</td></tr>';
                return;
            }

            users.forEach(user => {
                const expiry = user.expires_at ? new Date(user.expires_at).toLocaleDateString('pt-BR') : 'Vitalício';
                const isExpired = user.expires_at && new Date(user.expires_at) < new Date();
                const expiryClass = isExpired ? 'text-danger' : 'text-success';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td><span class="badge ${user.role === 'admin' ? 'bg-primary' : 'bg-secondary'}">${user.role}</span></td>
                    <td class="${expiryClass}">${expiry}</td>
                    <td>
                        <button class="btn btn-sm btn-info me-1" onclick="openAddDaysModal('${user.id}')">
                            <i class="bi bi-calendar-plus"></i> + Dias
                        </button>
                        ${user.role !== 'admin' ? `
                            <button class="btn btn-sm btn-danger" onclick="deleteUser('${user.id}', '${user.username}')">
                                <i class="bi bi-trash"></i> Remover
                            </button>
                        ` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Erro ao carregar usuários:', error);
            document.getElementById('user-table-body').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Erro ao carregar dados.</td></tr>';
        }
    }

    function openAddDaysModal(userId) {
        document.getElementById('modal-user-id').value = userId;
        const modal = new bootstrap.Modal(document.getElementById('addDaysModal'));
        modal.show();
    }

    async function confirmAddDays() {
        const userId = document.getElementById('modal-user-id').value;
        const days = parseInt(document.getElementById('days-to-add').value);
        const csrfToken = getCsrfTokenHead();

        try {
            const response = await fetch(`/api/admin/users/${userId}/access`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'csrf-token': csrfToken
                },
                body: JSON.stringify({ days })
            });

            if (response.ok) {
                Swal.fire('Sucesso!', 'Acesso estendido com sucesso!', 'success').then(() => location.reload());
            } else {
                Swal.fire('Erro', 'Não foi possível adicionar os dias.', 'error');
            }
        } catch (error) {
            Swal.fire('Erro', 'Falha na comunicação com o servidor.', 'error');
        }
    }

    async function deleteUser(userId, username) {
        const result = await Swal.fire({
            title: 'Tem certeza?',
            text: `Deseja remover o usuário ${username}?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sim, remover!',
            cancelButtonText: 'Cancelar'
        });

        if (result.isConfirmed) {
            const csrfToken = getCsrfTokenHead();
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'DELETE',
                headers: {
                    'csrf-token': csrfToken
                }
            });

            if (response.ok) {
                Swal.fire('Removido!', 'O usuário foi excluído.', 'success');
                loadUsers();
            } else {
                Swal.fire('Erro', 'Não foi possível remover o usuário.', 'error');
            }
        }
    }

    async function generateApk() {
        Swal.fire({
            title: 'Gerando APK...',
            text: 'Isso pode levar alguns minutos. Não feche a página.',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        const csrfToken = getCsrfTokenHead();
        try {
            const response = await fetch('/api/admin/generate-apk', {
                method: 'POST',
                headers: {
                    'csrf-token': csrfToken
                }
            });

            const result = await response.json();

            if (response.ok) {
                Swal.fire({
                    title: 'APK Pronto!',
                    text: 'O aplicativo foi gerado com sucesso.',
                    icon: 'success',
                    showCancelButton: true,
                    confirmButtonText: 'Baixar Agora',
                    cancelButtonText: 'Fechar'
                }).then((res) => {
                    if (res.isConfirmed) {
                        window.location.href = result.downloadUrl;
                    }
                });
            } else {
                Swal.fire('Erro', result.error || 'Falha ao gerar APK.', 'error');
            }
        } catch (error) {
            Swal.fire('Erro', 'Erro de conexão com o servidor.', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
  <script src="../static/js/dark_light.js"></script>
</body>
</html>
